name: Build release candidate

# Publishes the image of a final release on Docker Hub, as :<version> and
# :latest. The build itself lives in InseeFr/rmes-githubactions-commons, shared
# with the other RMéS projects.

on:
  release:
    types: [released]

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: InseeFr/rmes-githubactions-commons/.github/actions/docker-publish@main
        with:
          image: inseefr/magma-fusion
          dockerfile: Dockerfile.magma-fusion
          latest: 'true'
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}